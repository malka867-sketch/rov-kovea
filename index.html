<!DOCTYPE html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>הרוב קובע</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font:700 18px/1.3 system-ui,Arial,sans-serif;background:radial-gradient(circle at 20% 0,#7b2ff7,#2a0a63 55%,#12042f);color:#fff;min-height:100vh}
body.host{font-size:clamp(22px,2.4vw,38px)}
#app{max-width:760px;margin:auto;padding:1em}body.host #app{max-width:1400px}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
#mute{position:fixed;left:10px;top:10px;z-index:10;width:auto;padding:.3em .6em;font-size:1.1em;background:#fff3;color:#fff}
h1{text-align:center;font-size:2.4em;margin:.4em 0;text-shadow:0 4px 0 #0005}
.card{background:#ffffff1f;backdrop-filter:blur(6px);border:2px solid #ffffff2a;border-radius:1em;padding:.8em 1em;margin:.7em 0}
.top{display:flex;justify-content:space-between;align-items:center;opacity:.85;margin:0 2.2em}
input,select{width:100%;padding:.6em;font:inherit;border-radius:.6em;border:0;margin:.3em 0;color:#222}
button{font:inherit;padding:.6em 1em;border:0;border-radius:.7em;background:#ffa602;color:#222;cursor:pointer;width:100%;margin:.3em 0;box-shadow:0 .2em 0 #b87500}
button:active{transform:translateY(.15em);box-shadow:none}button:disabled{opacity:.4}button.alt{background:#2fb344;color:#fff;box-shadow:0 .2em 0 #1b7a2b}
.code{font-size:3.4em;font-weight:900;text-align:center;letter-spacing:.15em;color:#ffd84d}
.q{font-size:1.7em;text-align:center;padding:.3em 0;line-height:1.35}
.big{text-align:center;font-size:1.2em}.err{color:#ffb4b4;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(7.5em,1fr));gap:.5em}.grid button{background:#fff;color:#222;margin:0;box-shadow:0 .2em 0 #bbb}
.grid button.sel{background:#2fb344;color:#fff;box-shadow:0 .2em 0 #1b7a2b}
.lobby{display:flex;gap:1em;align-items:center;justify-content:center;flex-wrap:wrap}#qr{background:#fff;padding:.5em;border-radius:.6em;line-height:0}
.chip{display:inline-block;background:#ffffff30;border-radius:2em;padding:.1em .6em;margin:.15em;font-size:.85em}
.chip.me{outline:2px solid #ffd84d}.chip.win{background:#2fb344}
.st{display:flex;gap:.6em;align-items:center;min-height:1.9em;border-bottom:1px dashed #fff2}.st>b{width:2em;text-align:center;opacity:.7}
.bar{height:.7em;background:#fff3;border-radius:1em;overflow:hidden}.bar i{display:block;height:100%;background:#ffd84d;transition:width .3s}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:.6em;margin:1em 0;direction:ltr}
.pod div{width:30%;text-align:center;border-radius:.8em .8em 0 0;padding:.5em .2em;animation:rise 1.2s both}
.pod .p1{background:linear-gradient(#ffd84d,#e0a800);color:#222;height:10em;animation-delay:1.6s}
.pod .p2{background:linear-gradient(#e6e6e6,#aaa);color:#222;height:7.5em;animation-delay:.8s}
.pod .p3{background:linear-gradient(#e8a465,#a8662b);color:#222;height:5.5em}
.pod span{display:block;font-size:2em}
@keyframes rise{from{transform:translateY(120%);opacity:0}to{transform:none;opacity:1}}
.crown{font-size:3em;text-align:center;animation:bob 1s infinite alternate}@keyframes bob{to{transform:translateY(-.2em) scale(1.1)}}
.av{display:inline-block;font-size:1.7em;padding:.1em .2em;border-radius:.5em;cursor:pointer;margin:.1em;background:#fff2}.av.on{background:#ffd84d;outline:3px solid #fff}.x{cursor:pointer;color:#ff9a9a;margin-right:.3em}summary{cursor:pointer}#avs{text-align:center}
</style></head><body><canvas id="cv"></canvas><button id="mute" onclick="toggleMute()">🔊</button><div id="app"></div><script>
const $=id=>document.getElementById(id),app=$('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
let S=null,sess=JSON.parse(sessionStorage.s||'null'),err='',sel=null,lastRound=0,es,form={c:'',n:'',m:'',av:''},dOpen=false;
const AV=[...'🐶🐱🐼🦊🐯🦁🐵🐰🐸🐧🦄🐨🐙🦉🐢🦋👦👧👨👩🧒👴👵🦸🧙🧚🧛🤖👽🥷🎅'];
function pickAv(a){form.av=a;document.querySelectorAll('.av').forEach(e=>e.classList.toggle('on',e.textContent==a))}
// ---- sounds (synthesized, no files) ----
let ac,muted=false;
function tone(f,t,d,type='sine',v=.15){if(muted)return;try{ac=ac||new(window.AudioContext||webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;
 o.type=type;o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}catch(e){}}
const seq=(a,step,d,ty,v)=>a.forEach((f,i)=>tone(f,i*step,d,ty,v));
const SND={join:()=>seq([660,880],.1,.2),vote:()=>tone(700,0,.1),q:()=>seq([523,659,784,1047],.12,.3,'triangle'),
 res:()=>seq([392,494,587,784],.1,.35,'square',.07),win:()=>seq([523,523,523,659,587,659,784,784,1047],.18,.4,'triangle',.18)};
function toggleMute(){muted=!muted;$('mute').textContent=muted?'🔇':'🔊'}
// ---- confetti ----
function confetti(){const c=$('cv'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const P=[...Array(220)].map(()=>({x:Math.random()*c.width,y:-Math.random()*c.height,r:4+Math.random()*7,v:2+Math.random()*4,h:Math.random()*360,s:Math.random()*2-1}));
 const end=Date.now()+9000;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.y+=p.v;p.x+=p.s;if(p.y>c.height)p.y=-10;x.fillStyle=`hsl(${p.h},90%,60%)`;x.fillRect(p.x,p.y,p.r,p.r*1.6)});
 if(Date.now()<end)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}
// ---- network ----
async function api(a,d={}){const r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({a,code:sess&&sess.code,id:sess&&sess.id,...d})});return r.json()}
function connect(){es&&es.close();es=new EventSource('/events?code='+sess.code);
 es.onmessage=e=>{const pv=S;S=JSON.parse(e.data);if(sess.role=='player'&&!S.players.some(p=>p.id==sess.id)){err='המארח הוציא אותך מהמשחק. אפשר להתחבר מחדש.';leave();return}if(S.round!=lastRound){lastRound=S.round;sel=null}
  if(pv){if(S.phase=='vote'&&(pv.phase!='vote'||pv.round!=S.round))SND.q();else if(S.phase=='result'&&pv.phase!='result')SND.res();
   else if(S.phase=='end'&&pv.phase!='end'){SND.win();confetti()}else if(S.phase=='lobby'&&S.players.length>pv.players.length&&sess.role=='host')SND.join()}
  render()};
 es.onerror=()=>{if(es.readyState==2)leave()}}
function leave(){sessionStorage.removeItem('s');sess=null;S=null;es&&es.close();render()}
async function create(){tone(1,0,.01);const r=await api('create');sess={role:'host',code:r.code,id:r.id};sessionStorage.s=JSON.stringify(sess);connect()}
async function join(){form={c:$('c').value.trim(),n:$('n').value,m:$('m').value,av:form.av};sess={role:'player',code:form.c};
 const r=await api('join',{name:form.n,num:form.m,av:form.av});if(r.error){err=r.error;sess=null;render();return}
 sess.id=r.id;sessionStorage.s=JSON.stringify(sess);err='';connect()}
async function vote(t){sel=t;SND.vote();render();await api('vote',{target:t})}
async function taken(){const c=$('c').value.trim();if(c.length<6)return;const t=await(await fetch('/taken?code='+c)).json();if(!t)return;
 [...$('m').options].forEach(o=>o.disabled=t.includes(+o.value));if($('m').selectedOptions[0].disabled)$('m').value=[...$('m').options].find(o=>!o.disabled)?.value}
async function kick(id){const p=S.players.find(x=>x.id==id);if(p&&confirm('להוציא את '+p.name+' מהמשחק?'))api('kick',{pid:id})}
function chipList(host){return S.players.slice().sort((a,b)=>a.num-b.num).map(p=>`<span class=chip>${p.av||''} ${p.num} ${esc(p.name)}${host?` <a class=x onclick="kick('${p.id}')">✖</a>`:''}</span>`).join('')||'עדיין אין שחקנים…'}
function manage(){return`<details class=card ${dOpen?'open':''} ontoggle="dOpen=this.open"><summary>👥 ניהול שחקנים (הוצאת שחקן)</summary>${chipList(true)}</details>`}
// ---- views ----
function home(){document.body.className='';form.av=form.av||AV[Math.floor(Math.random()*AV.length)];form.c=form.c||new URLSearchParams(location.search).get('c')||'';
 let o='';for(let i=1;i<=60;i++)o+=`<option>${i}</option>`;
 app.innerHTML=`<h1>🗳️ הרוב קובע</h1><div class=card><div class=big>הצטרפות למשחק</div>
 <input id=c inputmode=numeric placeholder="קוד משחק" value="${esc(form.c)}" oninput=taken()><input id=n placeholder="השם שלך" maxlength=12 value="${esc(form.n)}">
 <div class=big>בחרו דמות:</div><div id=avs>${AV.map(a=>`<b class="av${a==form.av?' on':''}" onclick="pickAv('${a}')">${a}</b>`).join('')}</div><div class=big>המספר שלך:</div><select id=m>${o}</select><div class=err>${esc(err)}</div><button class=alt onclick=join()>כניסה</button></div>
 <div class=card><button onclick=create()>אני מארח משחק חדש</button></div>`;taken()}
function board(){const R=S.phase=='result'?S.result:null;let h='';
 for(let s=14;s>=0;s--){const here=S.players.filter(p=>p.pos==s).sort((a,b)=>a.num-b.num);
  h+=`<div class=st><b>${s==14?'🏁':s+1}</b><div>${here.map(p=>{const d=R?R.moves[p.id]||0:0,n=R?R.counts[p.id]||0:0;
   return`<span class="chip${p.id==sess.id?' me':''}${R&&R.winners.includes(p.id)?' win':''}">${p.av||''} ${p.num} ${esc(p.name)}${n?' 🗳'+n:''}${d>0?' ▲'+d:d<0?' ▼':''}</span>`}).join('')}</div></div>`}
 return h}
function podium(){if(!S.players.length)return'';const r=S.players.slice().sort((a,b)=>b.pos-a.pos||a.num-b.num),t=r.slice(0,3),m=['🥇','🥈','🥉'];
 const box=(p,i)=>p?`<div class=p${i+1}><span>${m[i]}</span><span>${p.av||''}</span>${esc(p.name)}<br>#${p.num}</div>`:'';
 return`<div class=crown>👑</div><h1>${esc(t[0].name)} ניצח!</h1><div class=pod>${box(t[1],1)}${box(t[0],0)}${box(t[2],2)}</div>
 ${r.length>3?`<div class=card>${r.slice(3).map((p,i)=>`<span class=chip>${i+4}. ${p.av||''} ${esc(p.name)}</span>`).join('')}</div>`:''}`}
function render(){if(!sess||!S)return home();
 const host=sess.role=='host',P=S.players,me=P.find(p=>p.id==sess.id),R=S.result;document.body.className=host?'host':'';
 let h=`<div class=top><b>הרוב קובע</b><span>קוד: ${S.code}</span><a href=# onclick="leave();return false" style="color:#fff">יציאה</a></div>`;
 const chips=chipList(host);
 if(S.phase=='lobby'){
  if(host)h+=`<h1>הצטרפו למשחק!</h1><div class="card lobby"><div id=qr></div><div><div class=big>סרקו את הקוד או היכנסו ל:</div><div class=big dir=ltr>${esc(location.host)}</div>
   <div class=big>וכתבו קוד:</div><div class=code>${S.code}</div></div></div><div class=card><div class=big>${P.length} שחקנים</div>${chips}</div>
   <button class=alt ${P.length<2?'disabled':''} onclick="api('start')">התחל משחק!</button>`;
  else h+=`<h1>אתה בפנים! 🎉</h1><div class=card><div class=q>${me?(me.av||'')+' '+me.num+' · '+esc(me.name):''}</div><div class=big>מחכים שהמארח יתחיל…</div></div><div class=card>${chips}</div>`}
 else if(S.phase=='vote'){
  h+=`<div class=card><div class=big>שאלה ${S.round}</div><div class=q>${esc(S.q)}</div></div>`;
  if(host){const v=P.filter(p=>p.voted).length;h+=`<div class=card><div class=big>הצביעו: ${v} מתוך ${P.length}</div><div class=bar><i style="width:${P.length?v/P.length*100:0}%"></i></div></div>
   <button onclick="api('reveal')">הצג תוצאות</button><div class=card>${board()}</div>${manage()}`}
  else h+=`<div class=big>${sel?'הצבעת ✔ אפשר לשנות':'מי הכי מתאים? לחצו על מספר'}</div><div class=grid>`+
   P.slice().sort((a,b)=>a.num-b.num).map(p=>`<button class="${sel==p.id?'sel':''}" onclick="vote('${p.id}')">${p.av||''} ${p.num}<br>${esc(p.name)}${p.id==sess.id?' (אני)':''}</button>`).join('')+`</div>`}
 else{
  const w=R.winners.map(id=>P.find(p=>p.id==id)).filter(Boolean);
  if(S.phase=='end')h+=podium();
  h+=`<div class=card><div class=q>${esc(S.q)}</div><div class=big>הרוב קבע: ${w.length?w.map(x=>(x.av||'')+' '+x.num+' · '+esc(x.name)).join(', '):'אף אחד'}</div></div>`;
  if(!host&&me){const d=R.moves[me.id]||0;h+=`<div class=card><div class=q>${d>=2?'🔥 קדימה '+d+' צעדים!':d==1?'👍 קדימה צעד אחד':d<0?'😬 צעד אחורה':'נשארת במקום'}</div></div>`}
  h+=`<div class=card>${board()}</div>`;
  if(host&&S.phase!='end')h+=manage();if(host)h+=S.phase=='end'?`<button onclick=leave()>משחק חדש</button>`:`<button class=alt onclick="api('next')">השאלה הבאה ◀</button>`;
  else if(S.phase=='end')h+=`<button onclick=leave()>סיום</button>`}
 app.innerHTML=h;
 const q=$('qr');if(q&&window.QRCode)new QRCode(q,{text:location.origin+'/?c='+S.code,width:Math.min(240,innerWidth*.5),height:Math.min(240,innerWidth*.5)})}
if(sess)connect();else render();
</script></body></html>
